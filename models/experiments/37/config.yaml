# Versioned components — same as exp 36; full retrain at 400bp with enhanced training regimen
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"
cnv:          "16_genome_cnv_caller"  # v16: noise filter + global CRR rescue threshold
evaluation:   "04_pf9_evaluation"    # v04: near-miss / blindspot diagnostics

# Data — stay on 400bp core genome (1000bp spans only ~2 bins for GCH1, making HMM harder)
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/37_06convvae_400bp_sinloss2.0_warmup80"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — full retrain from scratch (fix VAE signal sensitivity; cannot reuse exp 32 checkpoint)
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — slow warmup so the model first fully learns normal coverage
# before seeing CNV samples. 40 → 80: VAE spends 80 epochs ramping up to the 30% CNV mix
# rather than 40, giving it more time to tighten the normal distribution.
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  80   # exp 36: 40 — slower curriculum per Chiyun's feedback

# Sin loss — boost weight so the model penalises deviations from smooth sinusoidal
# coverage patterns more strongly. GCH1 FN CRR p50=1.42 shows signal exists; 1.0 → 2.0
# should make weak amplifications more detectable as reconstruction anomalies.
sin_loss_max_weight:    2.0   # exp 36: 1.0 — boost sinusoidal component
sin_loss_warmup_epochs: 30

# HMM segmentation — unchanged from exp 36 (400bp sweet spot)
hmm_n_states:          6
hmm_self_transition:   0.90
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — unchanged from exp 36
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:             50
cnv_crr_rescue_threshold:       1.55

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
