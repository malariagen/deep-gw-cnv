# Versioned components — same as exp 38/39/40; no retrain, no inference re-run.
# HMM must be re-run because hmm_self_transition changes.
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"
cnv:          "16_genome_cnv_caller"  # v16: noise filter disabled + global CRR rescue
evaluation:   "05_pf9_evaluation"    # v05: masked CNV rate diagnostic

# Data — same 400bp core genome as exp 37/38/39/40
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/41_06convvae_400bp_sinloss2.0_warmup80_st099"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — reuse exp 37 checkpoint (no retrain)
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — unchanged from exp 37
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  80

# Sin loss — unchanged from exp 37
sin_loss_max_weight:    2.0
sin_loss_warmup_epochs: 30

# HMM segmentation — self_transition raised from 0.96 to 0.99.
# Exp 40 raised self_transition 0.90 → 0.96, reducing transitions from p50=1189 to p50=970
# (only ~18% reduction). The 06_conv_vae produces noisier residuals than the old VAE used
# in exp 30/31, where 0.96 gave p50=270. The masked_cnv_rate is still 40-67% because the
# sanity check (>=55% chromosome CN=1) continues to fire with transitions p50=970.
# At 0.99, (1-p)=0.01 vs 0.04 at 0.96 — 4x lower transition probability. Empirical
# extrapolation: ~240 transitions p50 (exp 30-comparable), expected to restore sanity pass.
# CRR rescue at 1.55 provides a safety net for FNs the stickier HMM fails to segment
# (masked CRR p25=1.75-2.00 across all genes in exp 40).
hmm_n_states:          6
hmm_self_transition:   0.99   # raised from 0.96; targets remaining sanity-check failure
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — noise filter disabled (exp 39 finding); CRR rescue unchanged.
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:            ~      # null: noise filter remains disabled
cnv_crr_rescue_threshold:       1.55   # unchanged

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
