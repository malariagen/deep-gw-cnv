# Revised from original β=8 proposal after feedback: explore fully-connected architecture.
# FC encoder removes convolutional spatial-locality bias; may force higher reconstruction
# residuals for population-specific regional patterns (e.g. prevalent GCH1 amplifications).
# β kept at 4.0 (same as exp 45) to isolate the architecture change as the single variable.
# Full retrain required: architecture change affects all layers.
architecture: "07_fc_vae"
hmm:          "03_gaussian_hmm"   # v03: standard Gaussian HMM, no rolling-mean smoothing
cnv:          "18_genome_cnv_caller"  # v18: CRR rescue elevated above sanity check
evaluation:   "05_pf9_evaluation"    # v05: masked CNV rate diagnostic

# Data — same 400bp core genome as exp 45
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/46_07fcvae_beta4_cnvdrop05_18cnvcaller"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — architecture changed to FC VAE; all other hyperparameters unchanged from exp 45.
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      4.0    # same as exp 45; isolates architecture as the single variable
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — flat 5% (same as exp 45).
# Flat 5% gave dramatically better PPV than the 10%-ramp in exp 44, with no GCH1 FNR change.
# Retaining it here so the only change from exp 45 is the encoder/decoder architecture.
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.05
cnv_downsample_warmup_epochs:  80

# Sin loss — removed (same as exp 43/44/45)
sin_loss_max_weight:    0.0
sin_loss_warmup_epochs: 0

# HMM segmentation — unchanged from exp 45
hmm_n_states:          6
hmm_self_transition:   0.99
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — unchanged from exp 45
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:            ~      # null: noise filter remains disabled
cnv_crr_rescue_threshold:       1.55   # global threshold; unchanged

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
