# Versioned components — full retrain of 06_conv_vae without sin loss.
# Sin loss (max_weight=2.0) was causing noisy reconstructions that destabilised HMM
# segmentation. Removing it requires a retrain from scratch.
# Clean baseline: no HMM smoothing — 03_gaussian_hmm unchanged from prior exps.
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"   # v03: standard Gaussian HMM, no rolling-mean smoothing
cnv:          "16_genome_cnv_caller"  # v16: noise filter disabled + global CRR rescue
evaluation:   "05_pf9_evaluation"    # v05: masked CNV rate diagnostic

# Data — same 400bp core genome as exp 37/38/39/40/41
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/42_06convvae_400bp_nosinloss_warmup80_st099"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — reuse exp 37 checkpoint (no retrain)
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — unchanged from exp 37
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  80

# Sin loss — removed per Chiyun feedback: was causing weird/noisy reconstructions
# that destabilised HMM emission variance. Default is 0.0 (off).
sin_loss_max_weight:    0.0
sin_loss_warmup_epochs: 0

# HMM segmentation — clean baseline, no smoothing.
# Exp 40/41 showed that raising hmm_self_transition 0.90 → 0.96 → 0.99 reduced
# transitions p50 only 18% then 21% (1189 → 970 → 769). The transition prior
# cannot suppress oscillation driven by the 06_conv_vae's noisy residuals.
# Root fix: retrain VAE without sin loss so emissions are cleaner to begin with.
# No rolling-mean smoothing — this is the clean 400bp baseline.
hmm_n_states:          6
hmm_self_transition:   0.99   # kept from exp 41; revisit if transitions overshoot
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — noise filter disabled (exp 39 finding); CRR rescue unchanged.
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:            ~      # null: noise filter remains disabled
cnv_crr_rescue_threshold:       1.55   # unchanged

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
