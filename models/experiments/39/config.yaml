# Versioned components — same as exp 38; no retrain, no HMM re-run
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"
cnv:          "16_genome_cnv_caller"  # v16: noise filter + global CRR rescue threshold
evaluation:   "05_pf9_evaluation"    # v05: masked CNV rate diagnostic

# Data — same 400bp core genome as exp 37/38
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/39_06convvae_400bp_sinloss2.0_warmup80_notransfilter"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — reuse exp 37 checkpoint (no retrain)
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — unchanged from exp 37
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  80

# Sin loss — unchanged from exp 37
sin_loss_max_weight:    2.0
sin_loss_warmup_epochs: 30

# HMM segmentation — unchanged (reused via symlink)
hmm_n_states:          6
hmm_self_transition:   0.90
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — disable noise filter.
# Exp 38 revealed that cnv_max_transitions=50 is filtering ~98% of all samples, including
# CNV-positive samples with CRR p50=2.10 (GCH1). The HMM produces transitions p10=85,
# p50=1189 per sample — virtually all samples exceed 50. The noise filter fires at
# priority 0 before CRR rescue, so even strong amplifications are masked. Setting to null
# disables the filter entirely; PPV=1.00 in exp 38 shows no current FP problem.
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:            ~      # null: disable noise filter (was 50; too strict)
cnv_crr_rescue_threshold:       1.55   # unchanged — threshold change deferred

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
