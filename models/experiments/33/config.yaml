# Versioned components — VAE and eval unchanged; cnv reverts to v14 (no CRR rescue needed)
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"
cnv:          "14_genome_cnv_caller"  # v14: HMM-primary + conf 0.25 + explicit CN>=3 handling
evaluation:   "04_pf9_evaluation"    # v04: near-miss / blindspot diagnostics

# Data — same 400 bp core genome as exp 29/30/31/32
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/33_06convvae_400bp_core_200ep_st0.90"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — FULL RETRAIN from scratch (not reusing exp 29/30 checkpoint)
# KEY CHANGE: epochs 100 → 200. Exp 29 training hit the 100-epoch hard cap; the
# reconstruction baseline is 0.5-0.8× the input, suggesting the model had not fully
# converged. Better reconstruction quality should make the HMM residual signal
# (CRR = coverage / reconstruction) cleaner and more discriminative at gene loci.
latent_dim:    10
batch_size:    64
epochs:        200   # was 100; increase to allow full convergence
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      30    # was 20; increased to avoid premature stopping in later epochs

# Curriculum-weighted sampler — unchanged
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  40

# Sin loss — unchanged
sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

# HMM segmentation — st=0.90 as established in exp 32
# Full HMM re-run required (new checkpoint → new reconstructions → new segments)
hmm_n_states:          6
hmm_self_transition:   0.90   # same as exp 32; gene-scale events need short expected duration
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — unchanged from exp 31/32 (v14, HMM-primary, conf 0.25)
# No CRR rescue: we are testing whether reconstruction improvement alone fixes FNR
cnv_min_cn1_proportion:         0.55   # chromosome-level sanity: >= 55% CN=1 background required
cnv_min_confidence:             0.25   # same as exp 31/32
cnv_min_gene_coverage_fraction: 0.50   # primary call criterion (HMM-first)
cnv_flank_padding:            100000   # flank window for CRR diagnostic computation (unchanged)

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
