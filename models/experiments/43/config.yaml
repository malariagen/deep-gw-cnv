# Versioned components — caller upgraded to v18; VAE retrained with max_beta=4.0.
# Full retrain required: max_beta change alters the training objective.
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"   # v03: standard Gaussian HMM, no rolling-mean smoothing
cnv:          "18_genome_cnv_caller"  # v18: CRR rescue elevated above sanity check
evaluation:   "05_pf9_evaluation"    # v05: masked CNV rate diagnostic

# Data — same 400bp core genome as exp 42
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/43_06convvae_beta4_18cnvcaller"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — retrain with higher beta. max_beta raised 1.0 → 4.0 per feedback.
# Higher β strengthens KL regularisation, pushing the VAE to learn a more
# structured latent space. For reconstruction-based anomaly detection this
# can improve CRR contrast: normal profiles reconstruct well, amplified
# profiles reconstruct poorly. Risk: too-high β causes posterior collapse
# and weakens the reconstruction signal; 4.0 is the standard β-VAE value.
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      4.0   # raised from 1.0; full retrain required
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — unchanged from exp 42
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  80

# Sin loss — removed (same as exp 42)
sin_loss_max_weight:    0.0
sin_loss_warmup_epochs: 0

# HMM segmentation — full re-run needed (new checkpoint)
hmm_n_states:          6
hmm_self_transition:   0.99
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — v18 applies CRR rescue BEFORE the sanity check.
# Exp 42 masked CNV had CRR p10=1.58-1.62 across all genes, confirming real signal.
# In v16, sanity check ran first and assigned CN=-1 before rescue could fire.
# Rescue threshold unchanged at 1.55 (conservative; avoids expanding FP risk).
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50
cnv_flank_padding:            100000
cnv_max_transitions:            ~      # null: noise filter remains disabled
cnv_crr_rescue_threshold:       1.55   # unchanged; now applied before sanity check

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
