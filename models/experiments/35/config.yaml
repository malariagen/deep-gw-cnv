# Versioned components — reuse exp 32/34 artifacts; same caller (v16) with lower CRR threshold
architecture: "06_conv_vae"
hmm:          "03_gaussian_hmm"
cnv:          "16_genome_cnv_caller"  # v16: noise filter (max_transitions) + CRR rescue
evaluation:   "04_pf9_evaluation"    # v04: near-miss / blindspot diagnostics

# Data — same 400 bp core genome as all prior experiments
store_path: "../../../data/inputs/Pf9-53973-samples-400bp-core-npy"
out_dir:    "../../../data/results/35_06convvae_400bp_core_st0.90_noise_filter_crr1.45"
normalise:  true

# Gene annotation — unchanged
gff_path: "../../../assets/PlasmoDB-54_Pfalciparum3D7.gff"

# Model — reuse exp 32 checkpoint (100-epoch, same as exp 29/30/31/32/34)
latent_dim:    10
batch_size:    64
epochs:        100
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 0
patience:      20

# Curriculum-weighted sampler — unchanged
cnv_downsample_ratio_initial:  0.05
cnv_downsample_ratio_final:    0.30
cnv_downsample_warmup_epochs:  40

# Sin loss — unchanged
sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

# HMM segmentation — reused from exp 32 via symlink (st=0.90)
hmm_n_states:          6
hmm_self_transition:   0.90
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling — v16 with noise filter unchanged; CRR rescue threshold lowered 1.60 → 1.45.
# Exp 34 shows GCH1 FN CRR p50=1.48, p90=1.58 — just below the 1.60 threshold.
# The threshold was calibrated against exp 32 TN CRR p90=1.50–1.53 (noisy full sample set).
# In the callable subset (transitions ≤ 50), TN CRR p90=1.12 — far below 1.45 — so this
# reduction is safe. Expect to recover ~75%+ of the 147 GCH1 FNs (CRR ≥ 1.45 ≈ FN p25)
# without introducing FPs (no TN density between 1.12 and 1.45 in the callable set).
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.25
cnv_min_gene_coverage_fraction: 0.50   # HMM-primary threshold (unchanged)
cnv_flank_padding:            100000
cnv_max_transitions:             50    # samples with > 50 total CN transitions → CN=-1 (noise)
cnv_crr_rescue_threshold:       1.45   # lowered from 1.60; callable TN p90=1.12 gives safe margin

# Evaluation — unchanged
pf9_gt_path:   "../../../assets/20260313_full_cnv_data_pf9.tsv"
pf9_meta_path: "../../../assets/Pf_9_samples_20260227.txt"
eval_min_group_n: 10
